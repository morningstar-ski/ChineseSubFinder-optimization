services:
  chinesesubfinder:
    image: ${CSF_IMAGE:-ghcr.io/morningstar-ski/chinesesubfinder-optimization:latest}
    container_name: ${CSF_CONTAINER_NAME:-chinesesubfinder}
    hostname: ${CSF_HOSTNAME:-chinesesubfinder}
    restart: always
    environment:
      PUID: ${PUID:-1026}
      PGID: ${PGID:-100}
      PERMS: ${PERMS:-true}
      TZ: ${TZ:-Asia/Shanghai}
      UMASK: ${UMASK:-022}
    ports:
      - "${CSF_WEB_PORT:-19035}:19035"
      - "${CSF_STATIC_PORT:-19037}:19037"
    volumes:
      - ${CSF_CONFIG_DIR:-./config}:/config
      - ${CSF_MEDIA_DIR:-./media}:/media
      - ${CSF_BROWSER_DIR:-./browser}:/root/.cache/rod/browser
