services:
  chinesesubfinder:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        LITE_MODE: ${LITE_MODE:-true}
        INSTALL_BROWSER: ${INSTALL_BROWSER:-false}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
    image: ${CSF_IMAGE:-weishaw/chinesesubfinder:local}
    container_name: chinesesubfinder
    hostname: chinesesubfinder
    restart: always
    environment:
      PUID: ${PUID:-1026}
      PGID: ${PGID:-100}
      PERMS: ${PERMS:-true}
      TZ: ${TZ:-Asia/Shanghai}
      UMASK: ${UMASK:-022}
    ports:
      - "19035:19035"
      - "19037:19037"
    volumes:
      - ./config:/config
      - ./media:/media
      - ./browser:/root/.cache/rod/browser
